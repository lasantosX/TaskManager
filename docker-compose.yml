services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanager-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_password123"
    ports:
      - "14333:1433"

  api:
    image: taskmanager-api
    container_name: taskmanager-api
    build:
      context: .
      dockerfile: TaskManager.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskManagerDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver